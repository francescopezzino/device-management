hibernate:
    hbm2ddl:
        auto: validate
management:
    endpoints:
        jmx:
            exposure:
                include: health,metrics,info,env,beans,configprops
        web:
            exposure:
                include: health,metrics,info,env,beans,configprops
spring:
    datasource:
        driverClassName: org.postgresql.Driver
        password: password
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
    jpa:
        hibernate:
            ddl-auto: create
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        properties:
            hibernate:
                format_sql: true
springdoc:
    api-docs:
        path: /api-docs
logging:
    level:
        # Set to INFO or WARN to suppress DEBUG/FINE logs
        sun.rmi.loader: INFO
        # It is recommended to also silence these related JMX/RMI packages
        sun.rmi.transport.tcp: INFO
        javax.management.remote.rmi: INFO
        ROOT: DEBUG

